<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Approved Payments Financial History</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">  
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">  
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<header>  
    <span class="header-brand">Financial History</span>  
    <a href="../admin-panel.html" class="btn btn-outline btn-sm"><i class="fas fa-arrow-left"></i> Back to Admin</a>  
</header>
<main id="main-content" style="max-width:850px; margin-top:20px;">
    <div class="card card-body" style="padding:0;">
        <div id="approved-history-list"></div>
    </div>
</main>
<script type="module">
    import { auth, db, ref, get, onAuthStateChanged, ADMIN_EMAIL } from "../js/firebase-config.js";

    onAuthStateChanged(auth, user => {
        if(!user || user.email?.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) window.location.href = '../index.html';
    });

    async function loadHistory() {
        const snap = await get(ref(db, 'payment_requests'));
        const list = document.getElementById('approved-history-list');
        let html = "";
        if(snap.exists()) {
            snap.forEach(c => {
                const req = c.val();
                if(req.status === 'approved') {
                    html += `
                        <div class="list-row" style="flex-direction:column; align-items:flex-start; gap:4px; padding:12px; border-bottom:1px solid var(--border-color);">  
                            <div style="display:flex; justify-content:space-between; width:100%;">
                                <strong>${req.itemName}</strong>
                                <span class="badge" style="font-size:10px;">${req.itemType?.toUpperCase()}</span>
                            </div>
                            <div style="font-size:13px; color:var(--text-muted);">
                                Student: <strong>${req.userName || 'Student'}</strong> (${req.userEmail}) | TID: <strong>${req.transactionId}</strong>
                            </div>
                            <div style="font-size:12px; color:var(--primary);">
                                Authorization: <strong>${req.grantType || 'GRANTED'}</strong>
                            </div>
                            <div style="font-size:13px;">
                                Total: <strong>Rs ${req.amount}</strong> 
                                ${req.teacherShare ? `(Teacher: Rs ${req.teacherShare} | Platform: Rs ${req.adminShare})` : ''}
                            </div>
                            <div><small style="color:var(--text-muted);">${new Date(req.resolvedAt || req.timestamp).toLocaleString()}</small></div>  
                        </div>  
                    `;
                }
            });
        }
        list.innerHTML = html || '<p style="padding:20px; text-align:center;">No approved payment history found.</p>';
    }
    loadHistory();
</script>
</body>
</html>
