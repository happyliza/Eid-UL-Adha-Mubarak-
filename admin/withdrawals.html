<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Withdrawal Requests</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">  
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">  
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="toast-container"></div>
<header>  
    <span class="header-brand">Withdrawal Requests</span>  
    <a href="../admin-panel.html" class="btn btn-outline btn-sm"><i class="fas fa-arrow-left"></i> Back to Admin</a>  
</header>
<main id="main-content" style="max-width:750px; margin-top:20px;">
    <div id="withdrawals-list"></div>
</main>
<script type="module">
    import { auth, db, ref, onValue, get, set, update, onAuthStateChanged, ADMIN_EMAIL } from "../js/firebase-config.js";
    import { showToast } from "../js/common.js";

    onAuthStateChanged(auth, user => {
        if(!user || user.email?.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) window.location.href = '../index.html';
    });

    onValue(ref(db, 'withdrawal_requests'), snap => {
        const list = document.getElementById('withdrawals-list');
        let html = "";
        if(snap.exists()) {
            snap.forEach(c => {
                const wr = { id: c.key, ...c.val() };
                if(wr.status === 'pending') {
                    html += `
                        <div class="card card-body" style="margin-bottom:12px;">  
                            <p><strong>Teacher Name:</strong> ${wr.teacherName}</p>  
                            <p><strong>Requested Amount:</strong> <span style="color:var(--secondary); font-weight:bold;">Rs ${wr.amount}</span></p>  
                            <p><strong>Bank Details:</strong> ${wr.bankName} | ${wr.holderName} | ${wr.accountNumber}</p>  
                            <p><small style="color:var(--text-muted);">${new Date(wr.timestamp).toLocaleString()}</small></p>
                            <div style="display:flex; gap:8px; margin-top:10px;">  
                                <button class="btn btn-secondary btn-sm" style="flex:1;" onclick="window.approveWithdrawal('${wr.id}', '${wr.teacherUid}', ${wr.amount})">Mark Paid / Complete</button>  
                                <button class="btn btn-danger btn-sm" style="flex:1;" onclick="window.rejectWithdrawal('${wr.id}')">Reject</button>  
                            </div>  
                        </div>  
                    `;
                }
            });
        }
        list.innerHTML = html || '<p style="text-align:center; padding:20px;">No pending withdrawal requests.</p>';
    });

    window.approveWithdrawal = async function(reqId, tUid, amount) {
        const wRef = ref(db, `teacher_wallets/${tUid}/balance`);
        const snap = await get(wRef);
        let bal = snap.exists() ? snap.val() : 0;
        await set(wRef, Math.max(0, bal - amount));
        await update(ref(db, `withdrawal_requests/${reqId}`), { status: 'approved', resolvedAt: Date.now() });
        showToast("Withdrawal Marked as Paid!", "success");
    };

    window.rejectWithdrawal = async function(reqId) {
        await update(ref(db, `withdrawal_requests/${reqId}`), { status: 'rejected' });
        showToast("Withdrawal Rejected", "info");
    };
</script>
</body>
</html>
