<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Pending Payments</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">  
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">  
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="toast-container"></div>
<header>  
    <span class="header-brand">Pending Payments</span>  
    <a href="../admin-panel.html" class="btn btn-outline btn-sm"><i class="fas fa-arrow-left"></i> Back to Admin</a>  
</header>
<main id="main-content" style="max-width:850px; margin-top:20px;">
    <div id="payments-list"></div>
</main>
<script type="module">
    import { auth, db, ref, onValue, get, set, update, onAuthStateChanged, ADMIN_EMAIL } from "../js/firebase-config.js";
    import { showToast } from "../js/common.js";

    let allLiveClasses = [];

    onAuthStateChanged(auth, user => {
        if(!user || user.email?.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) window.location.href = '../index.html';
    });

    onValue(ref(db, 'live_classes'), snap => {
        allLiveClasses = [];
        if(snap.exists()) snap.forEach(c => allLiveClasses.push({ id: c.key, ...c.val() }));
    });

    onValue(ref(db, 'payment_requests'), snap => {
        const list = document.getElementById('payments-list');
        let html = "";
        if(snap.exists()) {
            snap.forEach(c => {
                const req = { id: c.key, ...c.val() };
                if(req.status === 'pending') {
                    const studentName = req.userName || 'Student';
                    const authGrantedDesc = req.grantType || (req.itemType?.toUpperCase() + ' ACCESS');

                    html += `
                        <div class="card card-body" style="margin-bottom:16px; border-left:4px solid var(--primary);">  
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                                <h3 style="font-size:16px;">${req.itemName}</h3>
                                <span class="badge">${req.itemType?.toUpperCase()}</span>
                            </div>

                            <div style="background:#F3F4F6; padding:10px; border-radius:6px; margin-bottom:10px; font-size:13px; line-height:1.6;">
                                <div><i class="fas fa-user"></i> <strong>Student:</strong> ${studentName} (${req.userEmail}) [UID: ${req.uid}]</div>
                                <div><i class="fas fa-chalkboard-teacher"></i> <strong>Instructor:</strong> ${req.instructorName || 'Platform/Admin'}</div>
                                <div style="color:var(--primary); font-weight:600;"><i class="fas fa-key"></i> <strong>Authorization to Grant:</strong> ${authGrantedDesc}</div>
                            </div>

                            <div style="display:flex; gap:16px; font-size:13px; margin-bottom:10px;">
                                <div><strong>Amount Paid:</strong> Rs ${req.amount}</div>
                                <div><strong>Method:</strong> ${req.method}</div>
                                <div><strong>TID:</strong> ${req.transactionId}</div>
                            </div>

                            ${req.teacherShare ? `<div style="font-size:12px; color:var(--secondary); margin-bottom:10px;"><strong>Revenue Split:</strong> Teacher gets Rs ${req.teacherShare} | Platform gets Rs ${req.adminShare}</div>` : ''}

                            <a href="${req.screenshotUrl}" target="_blank" class="btn btn-outline btn-sm" style="margin-bottom:12px; width:max-content;">
                                <i class="fas fa-external-link-alt"></i> View Payment Screenshot
                            </a>  

                            <div style="display:flex; gap:10px;">  
                                <button class="btn btn-secondary" style="flex:1;" onclick="window.approvePay('${req.id}', '${req.uid}', '${req.itemId}', '${req.itemType || 'course'}', '${req.instructorId || 'admin'}', ${req.amount || 0}, ${req.teacherShare || 0})">
                                    <i class="fas fa-check"></i> Approve & Grant Access
                                </button>  
                                <button class="btn btn-danger" style="flex:1;" onclick="window.rejectPay('${req.id}')">
                                    <i class="fas fa-times"></i> Reject
                                </button>  
                            </div>  
                        </div>  
                    `;
                }
            });
        }
        list.innerHTML = html || '<p style="padding:20px; text-align:center;">No pending payments right now.</p>';
    });

    window.approvePay = async function(reqId, uid, itemId, itemType, instructorId, amount, teacherShare) {
        await update(ref(db, `payment_requests/${reqId}`), { status: 'approved', resolvedAt: Date.now() });

        if(itemType === 'course') {
            await set(ref(db, `course_access/${uid}/${itemId}`), {
                courseId: itemId, accessType: 'lifetime', status: 'active', grantedAt: Date.now(), paymentId: reqId
            });
            if(instructorId && instructorId !== 'admin') {
                const wRef = ref(db, `teacher_wallets/${instructorId}/balance`);
                const snap = await get(wRef);
                const bal = snap.exists() ? snap.val() : 0;
                await set(wRef, bal + teacherShare);
            }
        } else if(itemType === 'live') {
            const liveObj = allLiveClasses.find(c => c.id === itemId);
            let expiresAt = 0;
            if(liveObj && liveObj.validity) {
                const now = Date.now();
                const day = 24 * 60 * 60 * 1000;
                if(liveObj.validity === '1 Month') expiresAt = now + (30 * day);
                else if(liveObj.validity === '3 Months') expiresAt = now + (90 * day);
                else if(liveObj.validity === '6 Months') expiresAt = now + (180 * day);
                else if(liveObj.validity === '1 Year') expiresAt = now + (365 * day);
            }
            await set(ref(db, `live_access/${uid}/${itemId}`), {
                classId: itemId, status: 'active', grantedAt: Date.now(), expiresAt, paymentId: reqId
            });
            if(instructorId && instructorId !== 'admin') {
                const wRef = ref(db, `teacher_wallets/${instructorId}/balance`);
                const snap = await get(wRef);
                const bal = snap.exists() ? snap.val() : 0;
                await set(wRef, bal + teacherShare);
            }
        } else if(itemType === 'pdf') {
            await set(ref(db, `pdf_access/${uid}/${itemId}`), { bookId: itemId, status: 'active', grantedAt: Date.now(), paymentId: reqId });
        } else if(itemType === 'package') {
            await update(ref(db, `users/${uid}`), { lifetimePdfAccess: true });
        } else if(itemType === 'all_courses_package') {
            await update(ref(db, `users/${uid}`), { lifetimeAllCoursesAccess: true });
        }

        showToast("Payment Approved & Authorization Granted Successfully!", "success");
    };

    window.rejectPay = async function(reqId) {
        await update(ref(db, `payment_requests/${reqId}`), { status: 'rejected' });
        showToast("Payment Rejected", "info");
    };
</script>
</body>
</html>
