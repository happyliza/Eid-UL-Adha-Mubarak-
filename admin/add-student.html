<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Custom Student</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">  
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">  
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="toast-container"></div>
<header>  
    <span class="header-brand">Add Custom Student</span>  
    <a href="../admin-panel.html" class="btn btn-outline btn-sm"><i class="fas fa-arrow-left"></i> Back to Admin</a>  
</header>
<main id="main-content" style="max-width:500px; margin-top:20px;">
    <div class="card card-body">
        <form id="form-add-student">  
            <div class="input-group"><label>Full Name</label><input type="text" id="aas-name" required></div>  
            <div class="input-group"><label>Email</label><input type="email" id="aas-email" required></div>  
            <div class="input-group"><label>Password</label><input type="password" id="aas-password" required minlength="6"></div>  
            <button type="submit" class="btn btn-primary" style="width:100%;">Create Student Account</button>  
        </form>
    </div>
</main>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { auth, db, ref, set, onAuthStateChanged, ADMIN_EMAIL, firebaseConfig } from "../js/firebase-config.js";
    import { showToast } from "../js/common.js";

    onAuthStateChanged(auth, user => {
        if(!user || user.email?.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) window.location.href = '../index.html';
    });

    document.getElementById('form-add-student').addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
            const name = document.getElementById('aas-name').value.trim();
            const email = document.getElementById('aas-email').value.trim();
            const password = document.getElementById('aas-password').value;

            const secondaryApp = initializeApp(firebaseConfig, "SecondaryApp" + Date.now());
            const secondaryAuth = getAuth(secondaryApp);
            const cred = await createUserWithEmailAndPassword(secondaryAuth, email, password);
            await set(ref(db, `users/${cred.user.uid}`), {
                name, email, isTeacher: false, lifetimePdfAccess: false, lifetimeAllCoursesAccess: false, createdAt: Date.now()
            });
            await signOut(secondaryAuth);
            showToast("Student created successfully!", "success");
            document.getElementById('form-add-student').reset();
        } catch(err) { showToast(err.message, "error"); }
    });
</script>
</body>
</html>
