<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Teachers & Students Roles</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">  
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">  
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="toast-container"></div>
<header>  
    <span class="header-brand">Manage Roles</span>  
    <a href="../admin-panel.html" class="btn btn-outline btn-sm"><i class="fas fa-arrow-left"></i> Back to Admin</a>  
</header>
<main id="main-content" style="max-width:800px; margin-top:20px;">
    <div class="card card-body" style="padding:0;">
        <div id="users-roles-list"></div>
    </div>
</main>
<script type="module">
    import { auth, db, ref, onValue, update, onAuthStateChanged, ADMIN_EMAIL } from "../js/firebase-config.js";
    import { showToast } from "../js/common.js";

    onAuthStateChanged(auth, user => {
        if(!user || user.email?.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) window.location.href = '../index.html';
    });

    onValue(ref(db, 'users'), snap => {
        const list = document.getElementById('users-roles-list');
        let html = "";
        if(snap.exists()) {
            const users = snap.val();
            for(let uid in users) {
                const u = users[uid];
                if(u.email?.toLowerCase() === ADMIN_EMAIL.toLowerCase()) continue;
                const isT = u.isTeacher === true;
                html += `
                    <div class="list-row" style="padding:12px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border-color);">  
                        <div>  
                            <div style="font-weight:600;">${u.name || 'User'}</div>  
                            <div style="font-size:12px; color:var(--text-muted);">${u.email}</div>  
                            <span class="badge ${isT ? 'badge-live' : 'badge-free'}" style="font-size:10px; margin-top:4px;">${isT ? 'Teacher' : 'Student'}</span>  
                        </div>  
                        <button class="btn ${isT ? 'btn-danger' : 'btn-primary'} btn-sm" onclick="window.toggleRole('${uid}', ${isT})">  
                            ${isT ? 'Remove Teacher' : 'Make Teacher'}  
                        </button>  
                    </div>  
                `;
            }
        }
        list.innerHTML = html || '<p style="padding:20px; text-align:center;">No users found.</p>';
    });

    window.toggleRole = async function(uid, currentStatus) {
        await update(ref(db, `users/${uid}`), { isTeacher: !currentStatus });
        showToast(currentStatus ? "Teacher Role Removed" : "Promoted to Teacher", "success");
    };
</script>
</body>
</html>
